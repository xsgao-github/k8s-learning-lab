<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">k8s-lab layered architecture</title>
  <desc id="arch-desc">Three layers: external clients, the Kubernetes control plane, and the worker plane running application pods, ingress-nginx, PostgreSQL, and Kafka.</desc>

  <style>
    .title { font: 700 22px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
    .band { font: 700 13px "Segoe UI", Arial, sans-serif; letter-spacing: 1.1px; fill: #475569; }
    .box-title { font: 600 15px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
    .box-sub { font: 400 12.5px "Segoe UI", Arial, sans-serif; fill: #475569; }
    .comp-title { font: 600 15px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
    .comp-sub { font: 400 11.5px "Segoe UI", Arial, sans-serif; fill: #475569; }
    .pod-title { font: 600 13.5px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
    .pod-sub { font: 400 11.5px "Segoe UI", Arial, sans-serif; fill: #64748b; }
    .note { font: 400 12px "Segoe UI", Arial, sans-serif; fill: #64748b; }
    .flow-label { font: 400 11.5px "Segoe UI", Arial, sans-serif; fill: #0369a1; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="1240" height="880" fill="#f8fafc"/>
  <text class="title" x="40" y="38">k8s-lab layered architecture</text>

  <!-- External layer -->
  <rect x="30" y="58" width="1180" height="128" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text class="band" x="52" y="84">CLIENT / EXTERNAL LAYER</text>

  <rect x="52" y="98" width="320" height="68" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text class="box-title" x="212" y="124" text-anchor="middle">Developer CLI</text>
  <text class="box-sub" x="212" y="146" text-anchor="middle">kubectl → kube-apiserver</text>

  <rect x="392" y="98" width="320" height="68" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text class="box-title" x="552" y="124" text-anchor="middle">Browser / HTTP client</text>
  <text class="box-sub" x="552" y="146" text-anchor="middle">curl, frontend, API calls</text>

  <rect x="732" y="98" width="456" height="68" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text class="box-title" x="960" y="124" text-anchor="middle">Windows host ports</text>
  <text class="box-sub" x="960" y="146" text-anchor="middle">localhost:80 and localhost:443</text>

  <!-- Cluster boundary -->
  <rect x="30" y="204" width="1180" height="626" rx="16" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text class="band" x="1190" y="230" text-anchor="end">KIND CLUSTER: k8s-lab · 3 DOCKER CONTAINERS</text>

  <!-- Control plane -->
  <rect x="50" y="246" width="1140" height="150" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text class="band" x="1170" y="272" text-anchor="end">CONTROL PLANE · k8s-lab-control-plane</text>

  <rect x="70" y="288" width="260" height="88" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text class="comp-title" x="200" y="318" text-anchor="middle">kube-apiserver</text>
  <text class="comp-sub" x="200" y="340" text-anchor="middle">REST API &amp; gateway</text>
  <text class="comp-sub" x="200" y="358" text-anchor="middle">all kubectl traffic</text>

  <rect x="350" y="288" width="260" height="88" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text class="comp-title" x="480" y="318" text-anchor="middle">etcd</text>
  <text class="comp-sub" x="480" y="340" text-anchor="middle">key-value state store</text>
  <text class="comp-sub" x="480" y="358" text-anchor="middle">cluster source of truth</text>

  <rect x="630" y="288" width="260" height="88" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text class="comp-title" x="760" y="318" text-anchor="middle">kube-scheduler</text>
  <text class="comp-sub" x="760" y="340" text-anchor="middle">binds pods to nodes</text>
  <text class="comp-sub" x="760" y="358" text-anchor="middle">requests, taints, affinity</text>

  <rect x="910" y="288" width="260" height="88" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text class="comp-title" x="1040" y="318" text-anchor="middle">kube-controller-manager</text>
  <text class="comp-sub" x="1040" y="340" text-anchor="middle">reconciliation loops</text>
  <text class="comp-sub" x="1040" y="358" text-anchor="middle">Deployments, ReplicaSets, HPA</text>

  <!-- Worker plane -->
  <rect x="50" y="496" width="1140" height="318" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text class="band" x="70" y="522">WORKER PLANE &amp; SERVICES</text>

  <rect x="70" y="410" width="1100" height="72" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text class="box-title" x="90" y="438">ingress-nginx controller · cluster add-on on k8s-lab-worker</text>
  <text class="box-sub" x="90" y="462">accepts host :80 / :443 and routes /api to order-service:8081</text>

  <rect x="70" y="534" width="1100" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="box-sub" x="620" y="558" text-anchor="middle">ClusterIP Services · order-service:8081 · payment-service:8082 · print-service:8083 · postgres:5432 · kafka:9092</text>

  <!-- Worker 1 -->
  <rect x="70" y="606" width="535" height="188" rx="12" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
  <text class="band" x="90" y="630">WORKER 1 · k8s-lab-worker</text>

  <rect x="90" y="644" width="240" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="pod-title" x="210" y="667" text-anchor="middle">order-service</text>
  <text class="pod-sub" x="210" y="683" text-anchor="middle">REST API</text>

  <rect x="345" y="644" width="240" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="pod-title" x="465" y="667" text-anchor="middle">payment-service</text>
  <text class="pod-sub" x="465" y="683" text-anchor="middle">Kafka consumer</text>

  <rect x="90" y="706" width="495" height="50" rx="8" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1.5"/>
  <text class="pod-title" x="337" y="729" text-anchor="middle">PostgreSQL · PVC</text>
  <text class="pod-sub" x="337" y="745" text-anchor="middle">order state and event data</text>

  <!-- Worker 2 -->
  <rect x="635" y="606" width="535" height="188" rx="12" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
  <text class="band" x="655" y="630">WORKER 2 · k8s-lab-worker2</text>

  <rect x="655" y="644" width="230" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="pod-title" x="770" y="667" text-anchor="middle">print-service</text>
  <text class="pod-sub" x="770" y="683" text-anchor="middle">Kafka consumer</text>

  <rect x="900" y="644" width="250" height="50" rx="8" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1.5"/>
  <text class="pod-title" x="1025" y="667" text-anchor="middle">Kafka (KRaft) · PVC</text>
  <text class="pod-sub" x="1025" y="683" text-anchor="middle">event backbone</text>

  <rect x="655" y="706" width="495" height="50" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="pod-sub" x="902" y="736" text-anchor="middle">spare capacity · HPA replicas · rescheduling during drains</text>

  <!-- Connections -->
  <path d="M 212 166 L 212 288" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 960 166 L 960 210 L 1205 210 L 1205 446 L 1172 446" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text class="flow-label" x="1012" y="202" text-anchor="middle">HTTP :80 / :443</text>
  <path d="M 620 482 L 620 534" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 337 588 L 337 606" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 902 588 L 902 606" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <text class="note" x="620" y="854" text-anchor="middle">Pod placement is illustrative; kube-scheduler decides. PostgreSQL and Kafka use PersistentVolumeClaims.</text>
</svg>
