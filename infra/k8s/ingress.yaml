apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coffee-platform
  namespace: k8s-lab
  labels:
    app.kubernetes.io/part-of: coffee-platform
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 8081
