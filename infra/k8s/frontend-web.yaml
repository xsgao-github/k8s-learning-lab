apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-web
  namespace: k8s-lab
  labels:
    app.kubernetes.io/name: frontend-web
    app.kubernetes.io/part-of: coffee-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-web
        app.kubernetes.io/part-of: coffee-platform
    spec:
      containers:
        - name: frontend-web
          image: frontend-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      securityContext:
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-web
  namespace: k8s-lab
  labels:
    app.kubernetes.io/name: frontend-web
    app.kubernetes.io/part-of: coffee-platform
spec:
  selector:
    app.kubernetes.io/name: frontend-web
  ports:
    - name: http
      port: 8080
      targetPort: http
